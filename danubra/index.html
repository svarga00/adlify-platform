<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1B3D">
  <title>DANUBRA — nábor a stavby v Nemecku</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-14 -14 124 128'><rect x='-14' y='-14' width='124' height='128' rx='22' fill='%230A1B3D'/><rect x='0' y='0' width='15' height='100' rx='7.5' fill='%23fff'/><path d='M 30 8.5 L 52 8.5 A 41.5 41.5 0 0 1 52 91.5 L 30 91.5' fill='none' stroke='%23F07E22' stroke-width='17' stroke-linecap='round'/></svg>">
  <!-- Klient Supabase si nesieme so sebou. Keď sa ťahal z unpkg.com a
       nenačítal sa, stránka zostala biela a bez hlášky. Pozri vendor/README.md. -->
  <script src="./vendor/supabase-js-2.116.0.js"></script>
  <!-- Mapa. Keď sa nenačíta, obrazovka ukáže body ako odkazy, nie bielu plochu. -->
  <script src="./vendor/leaflet-1.9.4.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./vendor/leaflet-1.9.4.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-brand" aria-label="DANUBRA">
        <svg class="logo-mark" viewBox="0 0 96 100" width="33" height="34" aria-hidden="true">
          <rect x="0" y="0" width="15" height="100" rx="7.5" fill="#0A1B3D"/>
          <path d="M 30 8.5 L 52 8.5 A 41.5 41.5 0 0 1 52 91.5 L 30 91.5"
                fill="none" stroke="#F07E22" stroke-width="17" stroke-linecap="round"/>
        </svg>
        <span class="logo-word">ANUBRA</span>
      </div>
      <form id="login-form">
        <label>E-mail
          <input type="email" id="login-email" required autocomplete="username" placeholder="ty@danubra.eu">
        </label>
        <label>Heslo
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Prihlásiť sa</button>
        <div id="login-error" class="login-error" hidden></div>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand" aria-label="DANUBRA">
        <svg class="logo-mark" viewBox="0 0 96 100" width="21" height="22" aria-hidden="true">
          <rect x="0" y="0" width="15" height="100" rx="7.5" fill="#fff"/>
          <path d="M 30 8.5 L 52 8.5 A 41.5 41.5 0 0 1 52 91.5 L 30 91.5"
                fill="none" stroke="#F07E22" stroke-width="17" stroke-linecap="round"/>
        </svg>
        <span class="logo-word">ANUBRA</span>
      </div>
      <div id="area-switch" class="area-switch"></div>
      <!-- Obal drží tieň na spodku, keď navigácia pokračuje pod okrajom. -->
      <div class="sidebar-scroll" id="sidebar-scroll">
        <nav id="sidebar-nav" class="sidebar-nav"></nav>
      </div>
      <div class="sidebar-foot">
        <div class="avatar" id="user-initial">·</div>
        <div class="who">
          <b id="user-name">—</b>
          <span id="user-email"></span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="Danubra.logout()" title="Odhlásiť" id="btn-logout"></button>
      </div>
    </aside>

    <div class="main">
      <!-- desktop topbar -->
      <header class="topbar">
        <button class="mega-btn" onclick="Danubra.toggleMega()" title="Všetky sekcie">
          <span class="mega-btn-ico"></span><span>Všetko</span>
        </button>
        <div class="searchbox">
          <span class="search-ico"></span>
          <input id="global-search" placeholder="Hľadať mesto, meno, telefón, číslo objednávky…">
        </div>
        <div id="topbar-actions" class="topbar-actions"></div>
      </header>

      <!-- mobile head -->
      <div class="mobile-head">
        <div class="mh-row">
          <button class="btn btn-ghost btn-sm" style="color:#fff;padding:6px 8px;" onclick="Danubra.toggleMega()" aria-label="Všetky sekcie" id="btn-menu"></button>
          <div class="mh-search">
            <span class="search-ico"></span>
            <input placeholder="Hľadať…">
          </div>
          <div class="avatar" id="user-initial-m">·</div>
        </div>
      </div>

      <main id="view" class="view"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./js/icons.js"></script>

  <script src="./lib/documents/templates.js"></script>
  <script src="./lib/staffing/margin.js"></script>
  <script src="./lib/staffing/compliance.js"></script>
  <script src="./lib/staffing/documents.js"></script>
  <script src="./lib/staffing/crews.js"></script>
  <script src="./lib/staffing/periods.js"></script>
  <script src="./lib/staffing/account.js"></script>
  <script src="./lib/geo.js"></script>
  <script src="./lib/outlook.js"></script>
  <script src="./lib/partners/payment.js"></script>
  <script src="./lib/quotes.js"></script>
  <script src="./lib/sms/provider.js"></script>
  <script src="./lib/recruiting/screening.js"></script>
  <script src="./lib/recruiting/process.js"></script>
  <script src="./lib/recruiting/chips.js"></script>
  <script src="./js/services/orders-service.js"></script>
  <script src="./js/services/invoicing.js"></script>
  <script src="./js/components/shell.js"></script>
  <script src="./js/components/comm-panel.js"></script>

  <script src="./js/modules/compliance-view.js"></script>
  <script src="./js/modules/settings.js"></script>
</body>
</html>
