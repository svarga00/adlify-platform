<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1B3D">
  <title>DANUBRA Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 110'><rect width='110' height='110' fill='%230A1B3D'/><rect x='6' y='17.5' width='14' height='85' rx='7' fill='%23fff'/><path d='M 34 26 L 58 26 A 34 34 0 0 1 58 94 L 34 94' fill='none' stroke='%23F07E22' stroke-width='17' stroke-linecap='round'/></svg>">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-brand">
        <svg viewBox="6 17.5 94.5 85" width="44" height="44" aria-hidden="true">
          <rect x="6" y="17.5" width="14" height="85" rx="7" fill="#0A1B3D"/>
          <path d="M 34 26 L 58 26 A 34 34 0 0 1 58 94 L 34 94" fill="none" stroke="#F07E22" stroke-width="17" stroke-linecap="round"/>
        </svg>
        <h1>ANUBRA <span class="hub">HUB</span></h1>
        <p>Interný systém</p>
      </div>
      <form id="login-form">
        <label>E-mail
          <input type="email" id="login-email" required autocomplete="username" placeholder="ty@danubra.eu">
        </label>
        <label>Heslo
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Prihlásiť sa</button>
        <div id="login-error" class="login-error" hidden></div>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg viewBox="6 17.5 94.5 85" width="26" height="26" aria-hidden="true">
          <rect x="6" y="17.5" width="14" height="85" rx="7" fill="#fff"/>
          <path d="M 34 26 L 58 26 A 34 34 0 0 1 58 94 L 34 94" fill="none" stroke="#F07E22" stroke-width="17" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="sb-name">ANUBRA</div>
          <div class="sb-sub">INTERNÝ SYSTÉM</div>
        </div>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <div class="avatar" id="user-initial">·</div>
        <div class="who">
          <b id="user-name">—</b>
          <span id="user-email"></span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="Danubra.logout()" title="Odhlásiť" id="btn-logout"></button>
      </div>
    </aside>

    <div class="main">
      <!-- desktop topbar -->
      <header class="topbar">
        <div class="searchbox">
          <span class="search-ico"></span>
          <input id="global-search" placeholder="Hľadať mesto, meno, telefón, číslo objednávky…">
        </div>
        <div id="topbar-actions" class="topbar-actions"></div>
      </header>

      <!-- mobile head -->
      <div class="mobile-head">
        <div class="mh-row">
          <button class="btn btn-ghost btn-sm" style="color:#fff;padding:6px 8px;" onclick="Danubra.toggleSidebar()" aria-label="Menu" id="btn-menu"></button>
          <div class="mh-search">
            <span class="search-ico"></span>
            <input placeholder="Hľadať…">
          </div>
          <div class="avatar" id="user-initial-m">·</div>
        </div>
      </div>

      <main id="view" class="view"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./js/icons.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./lib/billing/regime.js"></script>
  <script src="./lib/matching.js"></script>
  <script src="./js/app.js"></script>
  <script src="./lib/orders/state-machine.js"></script>
  <script src="./lib/billing/ongoing-service.js"></script>
  <script src="./lib/qr.js"></script>
  <script src="./lib/documents/templates.js"></script>
  <script src="./lib/staffing/margin.js"></script>
  <script src="./lib/staffing/compliance.js"></script>
  <script src="./lib/sms/provider.js"></script>
  <script src="./js/services/orders-service.js"></script>
  <script src="./js/services/invoicing.js"></script>
  <script src="./js/components/comm-panel.js"></script>
  <script src="./js/modules/accommodations.js"></script>
  <script src="./js/modules/clients.js"></script>
  <script src="./js/modules/inquiries.js"></script>
  <script src="./js/modules/offers.js"></script>
  <script src="./js/modules/orders.js"></script>
  <script src="./js/modules/invoices.js"></script>
  <script src="./js/modules/workers.js"></script>
  <script src="./js/modules/subcontracts.js"></script>
  <script src="./js/modules/partners.js"></script>
  <script src="./js/modules/timesheets.js"></script>
  <script src="./js/modules/marketing.js"></script>
  <script src="./js/modules/recruiting.js"></script>
</body>
</html>
