<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>DANUBRA Hub</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">D</div>
        <h1>DANUBRA Hub</h1>
        <p>Interný systém sprostredkovania ubytovania</p>
      </div>
      <form id="login-form">
        <label>E-mail
          <input type="email" id="login-email" required autocomplete="username" placeholder="ty@danubra.eu">
        </label>
        <label>Heslo
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Prihlásiť sa</button>
        <div id="login-error" class="login-error" hidden></div>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <!-- Sidebar (desktop) -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">D</div>
        <span>DANUBRA</span>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <span id="user-email" class="user-email"></span>
        <button class="btn btn-ghost btn-sm" onclick="Danubra.logout()">Odhlásiť</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="topbar-menu" onclick="Danubra.toggleSidebar()" aria-label="Menu">☰</button>
        <h1 id="page-title" class="topbar-title">Dashboard</h1>
        <div id="topbar-actions" class="topbar-actions"></div>
      </header>
      <main id="view" class="view"></main>
    </div>

    <!-- Bottom tabs (mobile) -->
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="./js/config.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
