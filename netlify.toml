# ============================================================================
# Nasadenie
# ============================================================================
# Aplikácia býva v /app/, koreň na ňu presmeruje, nech sa netreba trafiť
# do podadresára.
#
# POZOR — musí to byť presmerovanie (302), nie prepis (200).
#
# Pri prepise sa obsah podstrčí, ale adresa v prehliadači zostane „/". Odkazy
# v index.html sú relatívne (`./js/app.js`, `./app.css`), takže sa vyhodnotia
# voči „/" a nie voči „/app/" — a **každý jeden súbor skončí na 404**.
# Stránka je potom úplne biela, bez štýlov aj bez kódu, takže sa nespustí ani
# hláška o chybe. Presne to sa stalo v prevádzke.
#
# Pri presmerovaní sa adresa zmení na „/app/" a relatívne cesty sedia.
# To isté platí pre „/app" bez lomky — bez nej sa relatívna cesta
# vyhodnotí o úroveň vyššie.

[[redirects]]
  from = "/"
  to = "/app/"
  status = 302
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 302

# Weby punds.sk a punds.eu (web/). Skúšobne bežia pod touto adresou:
#   /punds-sk/sk/…  a  /punds-eu/de/…
# Stránky skladá funkcia punds-web (aj formuláre /punds-*/api/*).
# Naostro: punds.sk a punds.eu sa pridajú ako domény tohto webu a zapne sa
# edge funkcia z web/edge/punds-host.js (návod je v nej).
[[redirects]]
  from = "/punds-sk"
  to = "/.netlify/functions/punds-web"
  status = 200
[[redirects]]
  from = "/punds-sk/*"
  to = "/.netlify/functions/punds-web"
  status = 200
[[redirects]]
  from = "/punds-eu"
  to = "/.netlify/functions/punds-web"
  status = 200
[[redirects]]
  from = "/punds-eu/*"
  to = "/.netlify/functions/punds-web"
  status = 200
# Balík dokumentov pre živnostníka: WhatsApp/SMS nesú jeden krátky odkaz
#   /b/<token>               stránka so všetkými PDF
#   /b/<token>/<archive_id>  stiahnutie (302 na podpísaný odkaz, 60 s)
# Skladá to funkcia punds-bundle (service role, bez prihlásenia). Prepis
# (200) — adresa v prehliadači zostane /b/…; funkcia číta token z event.path
# aj z adresy funkcie. Musí byť pred každým prípadným záchytným pravidlom „/*".
[[redirects]]
  from = "/b/*"
  to = "/.netlify/functions/punds-bundle/:splat"
  status = 200
  force = true

# Zdrojáky webov nie sú statické súbory — von ide len web/public.
[[redirects]]
  from = "/web/sk/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/eu/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/shared/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/edge/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/tests/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/server.js"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/api.js"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/notify.js"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/emails.js"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/dev.js"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/content.js"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/web/README.md"
  to = "/404"
  status = 404
  force = true

# To isté pre appku: von ide koreň repozitára, takže bez týchto pravidiel by
# sa dal stiahnuť zdroják serverových funkcií, celá schéma databázy aj
# s politikami (migrácie), testy a interné poznámky. Tajomstvá v nich nie sú
# (kľúče sú len v premenných prostredia), ale mapa toho, kde hľadať slabé
# miesto, nemá byť verejná. Appka sama (/app/js, /app/lib, /app/vendor…)
# ostáva, tú prehliadač potrebuje.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/app/database/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/app/tests/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/app/README.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/app/BIZNIS-KONTEXT.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/app/NABOR.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/app/NASTAVENIE.md"
  to = "/404"
  status = 404
  force = true

# Písma a obrázky webov sa nemenia — prehliadač ich môže držať dlho.
[[headers]]
  for = "/web/public/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/web/public/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
# Appka: nedá sa vložiť do cudzej stránky (klikanie cez neviditeľný rámik),
# prehliadač nehádá typ súboru a adresa s id záznamu neodchádza na cudzie weby.
[[headers]]
  for = "/app/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
# Statické súbory webov (stránky samé dostávajú hlavičky z web/server.js).
[[headers]]
  for = "/web/public/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Appka bývala v /danubra/. Kto má starý odkaz v záložkách alebo v histórii,
# musí skončiť v appke, nie na hlásení „Page not found" — 301, lebo je to
# presun natrvalo. Cesta za lomkou sa zachová; kotva (#/dashboard) sa na
# server vôbec neposiela, tú prehliadač pripojí späť sám.
[[redirects]]
  from = "/danubra"
  to = "/app/"
  status = 301
[[redirects]]
  from = "/danubra/*"
  to = "/app/:splat"
  status = 301

# Node 22: knižnica na posielanie e-mailov (nodemailer) potrebuje aspoň Node 20.
# Funkcie na Netlify bežia na tej istej verzii ako build.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Denný cron — prechody stavov, pripomienky, faktúry po splatnosti,
# nábory, ktoré nestíhajú, a mazanie nahrávok po uplynutí retencie.
# 04:00 UTC ≈ 06:00 SK v lete, 05:00 v zime.
[functions."danubra-cron-daily"]
  schedule = "0 4 * * *"

# Mesačné návrhy faktúr za priebežnú službu.
# Beží 28.–31. o 20:00 UTC, funkcia si sama overí, či je posledný deň mesiaca.
[functions."danubra-cron-monthly"]
  schedule = "0 20 28-31 * *"

# Pošta: každých 10 minút stiahne nové e-maily zo schránok (spustí funkciu na pozadí).
[functions."danubra-mail-sync-cron"]
  schedule = "*/10 * * * *"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"
