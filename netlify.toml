# Funkcie
[functions]
  directory = "netlify/functions"

# Scheduled function — outreach scheduler (posiela ďalšie kroky kampaní)
# Cron: každú hodinu o :05. Scheduler dnes rešpektuje business hours
# (8-18 SK, skip víkendov) a per-mail jitter, takže väčšina behov mimo
# pracovných hodín bude no-op.
[functions."outreach-scheduler"]
  schedule = "5 * * * *"

# Auto warm-up rampa — raz denne ráno 7:00 UTC (~8-9 SK podľa DST).
# Posunie warmup_current o +20% kým nedosiahne daily_limit, pri vysokom
# bounce rate (>5%) namiesto rampu spraví -50% pause.
[functions."outreach-warmup-rampa"]
  schedule = "0 7 * * *"

# Scheduled function — sync Google/Meta Ads metrík každé 2 hodiny o :15
[functions."ads-scheduled-sync"]
  schedule = "15 */2 * * *"

# Plugin pre inštaláciu dependencies vo functions
[[plugins]]
  package = "@netlify/plugin-functions-install-core"
