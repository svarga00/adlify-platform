<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1B3D">
  <!-- Appka sa dá pridať na plochu telefónu a otvára sa ako aplikácia. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="punds">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>punds — nábor a stavby v Nemecku</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <!-- Klient Supabase si nesieme so sebou. Keď sa ťahal z unpkg.com a
       nenačítal sa, stránka zostala biela a bez hlášky. Pozri vendor/README.md. -->
  <script src="./vendor/supabase-js-2.116.0.js"></script>
  <!-- Mapa. Keď sa nenačíta, obrazovka ukáže body ako odkazy, nie bielu plochu. -->
  <script src="./vendor/leaflet-1.9.4.js"></script>
  <!-- Písmo je naše, nie z Google (pozri vendor/README.md). Načíta sa
       dopredu, aby sa text nekreslil najprv systémovým písmom a potom znova. -->
  <link rel="preload" href="./vendor/fonts/inter-latin.woff2" as="font"
    type="font/woff2" crossorigin>
  <link rel="preload" href="./vendor/fonts/inter-latin-ext.woff2" as="font"
    type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./vendor/leaflet-1.9.4.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <!-- Značka punds: znak „∩∪" (un z p-un-ds) a slovo. -->
      <div class="login-brand" aria-label="punds">
        <svg class="logo-mark" viewBox="2.25 7.25 43.5 33.5" width="40" height="31" fill="none" aria-hidden="true">
          <path d="M6 34 V20 A9 9 0 0 1 24 20 V28" stroke="#0E1626" stroke-width="7.5" stroke-linecap="round"/>
          <path d="M24 28 A9 9 0 0 0 42 28 V14" stroke="#F07F1A" stroke-width="7.5" stroke-linecap="round"/>
        </svg>
        <span class="logo-txt"><span class="logo-word">punds</span><span class="logo-tag">PARTNER UND SERVICE</span></span>
      </div>
      <form id="login-form">
        <label>E-mail
          <input type="email" id="login-email" required autocomplete="username" placeholder="meno@firma.sk">
        </label>
        <label>Heslo
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Prihlásiť sa</button>
        <div id="login-error" class="login-error" hidden></div>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand" aria-label="punds">
        <svg class="logo-mark" viewBox="2.25 7.25 43.5 33.5" width="30" height="23" fill="none" aria-hidden="true">
          <path d="M6 34 V20 A9 9 0 0 1 24 20 V28" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/>
          <path d="M24 28 A9 9 0 0 0 42 28 V14" stroke="#F07F1A" stroke-width="7.5" stroke-linecap="round"/>
        </svg>
        <span class="logo-txt"><span class="logo-word">punds</span><span class="logo-tag">PARTNER UND SERVICE</span></span>
      </div>
      <div id="area-switch" class="area-switch"></div>
      <!-- Obal drží tieň na spodku, keď navigácia pokračuje pod okrajom. -->
      <div class="sidebar-scroll" id="sidebar-scroll">
        <nav id="sidebar-nav" class="sidebar-nav"></nav>
      </div>
      <div class="sidebar-foot">
        <div class="avatar" id="user-initial">·</div>
        <div class="who">
          <b id="user-name">—</b>
          <span id="user-email"></span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="Danubra.logout()" title="Odhlásiť" id="btn-logout"></button>
      </div>
    </aside>

    <div class="main">
      <!-- desktop topbar -->
      <header class="topbar">
        <button class="mega-btn" onclick="Danubra.toggleMega()" title="Všetky sekcie">
          <span class="mega-btn-ico"></span><span>Všetko</span>
        </button>
        <div class="searchbox">
          <span class="search-ico"></span>
          <input id="global-search" placeholder="Hľadať mesto, meno, telefón, číslo objednávky…">
        </div>
        <!-- „Ako to ide" a jemu podobné: nie je to agenda, je to mapa appky.
             Napĺňa to `Danubra._buildNav()` podľa `topRoutes`. -->
        <div id="top-links" class="top-links"></div>
        <div id="topbar-actions" class="topbar-actions"></div>
        <!-- Papiere na dva kliky: vyber papier, vyber človeka. Je na každej
             obrazovke, lebo papier treba práve vtedy, keď na ňu človek
             nemyslí. Pozri js/components/papers.js. -->
        <button class="top-papers no-print" onclick="Pap.open()" id="btn-papers"
          title="Súhlas GDPR, zmluva, objednávka, infolist — údaje sa doplnia samy"></button>
        <!-- Vysvetlivky. Nie je to nápoveda k tlačidlám — je to zoznam toho,
             čo ktoré číslo znamená a prečo sa počíta práve tak. -->
        <button class="bell-btn no-print" onclick="Help.index()" title="Vysvetlivky"
          aria-label="Vysvetlivky" id="btn-help"></button>
        <!-- Zvonček. Napĺňa ho `Danubra.renderBell()`; kým sa udalosti
             nenačítajú, je tu prázdno, nie prázdny rámik. -->
        <div id="bell-slot" class="bell-wrap"></div>
      </header>

      <!-- mobile head -->
      <div class="mobile-head">
        <div class="mh-row">
          <button class="btn btn-ghost btn-sm" style="color:#fff;padding:6px 8px;" onclick="Danubra.toggleMega()" aria-label="Všetky sekcie" id="btn-menu"></button>
          <div class="mh-search">
            <span class="search-ico"></span>
            <input placeholder="Hľadať…">
          </div>
          <!-- Na mobile horný pruh nie je, takže zvonček musí byť aj tu —
               inak by sa o udalostiach z telefónu nedalo dozvedieť. -->
          <button class="bell-btn no-print" onclick="Pap.open()" title="Papiere"
            aria-label="Papiere" id="btn-papers-m"></button>
          <button class="bell-btn no-print" onclick="Help.index()" title="Vysvetlivky"
            aria-label="Vysvetlivky" id="btn-help-m"></button>
          <div id="bell-slot-m" class="bell-wrap bell-dark"></div>
          <div class="avatar" id="user-initial-m">·</div>
        </div>
      </div>

      <!-- Na mobile horný pruh nie je, takže tlačidlá obrazovky („Nahrať
           faktúry", „Načítať výpis"…) idú sem. Bez toho sa na telefóne
           nedali spraviť. Napĺňa to `Danubra.setActions()`. -->
      <div id="m-actions" class="m-actions no-print"></div>

      <main id="view" class="view"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
