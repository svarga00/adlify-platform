<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Potvrdenie faktúry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  /* Stránka pre živnostníka: faktúra, ktorú sme vystavili za neho, a dve
     tlačidlá. Bez prihlásenia — prístup dáva tajný kľúč v odkaze. */
  :root { --ink: #0A1B3D; --mute: #6F7C95; --line: #DDE3EE; --bg: #F4F6FA; --blue: #1E4FD8;
    --green: #157A4A; --green-50: #E7F6EE; --red: #C0392B; --red-50: #FDECEA; --orange: #F07E22; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -.01em; }
  p { margin: 0 0 8px; }
  .mute { color: var(--mute); font-size: 13.5px; }
  .sum { font-size: 26px; font-weight: 800; }
  iframe { width: 100%; height: 70vh; min-height: 420px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  button { font: inherit; font-weight: 700; border-radius: 10px; padding: 13px 18px; cursor: pointer; border: 1.5px solid transparent; }
  .yes { background: var(--green); color: #fff; flex: 1 1 220px; }
  .no { background: #fff; color: var(--red); border-color: var(--red); flex: 1 1 160px; }
  textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; min-height: 90px; margin-top: 10px; }
  .ok { background: var(--green-50); color: var(--green); border-color: #BFE5CF; }
  .bad { background: var(--red-50); color: var(--red); border-color: #F5C6C0; }
  .hide { display: none; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="head"><h1>Načítavam faktúru…</h1></div>
  <iframe id="doc" title="Faktúra" class="hide"></iframe>
  <div class="card hide" id="decide">
    <p><b>Skontrolujte prosím faktúru.</b> Vystavili sme ju za Vás podľa hodín, ktoré ste
      odpracovali a ktoré potvrdil odberateľ. Ak všetko sedí, potvrďte ju — pošleme Vám peniaze
      v termíne splatnosti.</p>
    <p class="mute">Ak do 5 dní nenamietnete, faktúra sa podľa zmluvy považuje za potvrdenú.</p>
    <div class="acts">
      <button class="yes" id="btn-yes">Potvrdzujem faktúru</button>
      <button class="no" id="btn-no">Nesúhlasím</button>
    </div>
    <div id="object" class="hide">
      <textarea id="why" placeholder="Napíšte, s čím nesúhlasíte (napr. chýbajú hodiny z 12. 10.)"></textarea>
      <div class="acts"><button class="no" id="btn-send">Odoslať námietku</button></div>
    </div>
  </div>
</div>
<script src="./lib/documents/templates.js"></script>
<script>
(function () {
  const API = '/.netlify/functions/danubra-self-bill';
  const t = new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);
  const money = (n) => Number(n || 0).toLocaleString('sk-SK', { style: 'currency', currency: 'EUR' });
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function show(d) {
    const b = d.bill || {};
    const meno = ((b.extracted || {})._self || {}).company || {};
    $('doc').classList.remove('hide');
    $('doc').srcdoc = window.DanubraPapers.selfInvoice({ bill: b, period: d.period });
    const stav = {
      self_sent: ['', `Vaša faktúra ${esc(b.bill_number)}, ktorú za Vás vystavila ${esc(meno.name || 'naša firma')}`],
      approved: ['ok', 'Faktúru ste potvrdili. Ďakujeme — zaplatíme ju v termíne splatnosti.'],
      paid: ['ok', 'Faktúra je zaplatená. Ďakujeme.'],
      disputed: ['bad', 'Faktúru ste namietli. Ozveme sa Vám a doriešime to.'],
    }[d.status] || ['', 'Faktúra'];
    $('head').className = `card ${stav[0]}`;
    $('head').innerHTML = `<h1>${stav[1]}</h1>
      <div class="sum">${money(b.amount)}</div>
      <p class="mute">Splatnosť ${b.due_date ? new Date(b.due_date).toLocaleDateString('sk-SK') : '—'}
        ${d.note ? ` · Vaša námietka: ${esc(d.note)}` : ''}</p>`;
    $('decide').classList.toggle('hide', d.status !== 'self_sent');
  }

  function fail(msg) {
    $('head').className = 'card bad';
    $('head').innerHTML = `<h1>${esc(msg)}</h1><p class="mute">Ak ste odkaz dostali od nás,
      ozvite sa prosím tomu, kto Vám ho poslal.</p>`;
    $('decide').classList.add('hide');
  }

  async function send(body) {
    ['btn-yes', 'btn-no', 'btn-send'].forEach(id => { $(id).disabled = true; });
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t, ...body }) });
      const d = await r.json();
      if (d.bill) show(d);
      if (!r.ok && d.error) alertBox(d.error);
    } catch (e) { alertBox('Nepodarilo sa odoslať. Skúste to prosím znova.'); }
    ['btn-yes', 'btn-no', 'btn-send'].forEach(id => { $(id).disabled = false; });
  }
  function alertBox(msg) {
    const p = document.createElement('p'); p.className = 'card bad'; p.textContent = msg;
    $('decide').prepend(p);
  }

  $('btn-yes').onclick = () => send({ action: 'confirm' });
  $('btn-no').onclick = () => { $('object').classList.remove('hide'); $('why').focus(); };
  $('btn-send').onclick = () => {
    const note = $('why').value.trim();
    if (note.length < 3) return alertBox('Napíšte prosím, s čím nesúhlasíte.');
    send({ action: 'object', note });
  };

  if (!/^[a-f0-9]{48,96}$/.test(t)) return fail('Odkaz je neplatný.');
  fetch(`${API}?t=${encodeURIComponent(t)}`).then(r => r.json().then(d => ({ r, d })))
    .then(({ r, d }) => (r.ok ? show(d) : fail(d.error || 'Faktúra sa nenašla.')))
    .catch(() => fail('Faktúru sa nepodarilo načítať.'));
})();
</script>
</body>
</html>
